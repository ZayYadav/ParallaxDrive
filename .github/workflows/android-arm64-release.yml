name: Build Parallax Drive ARM64 Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - parallax-drive-android-apk
    paths:
      - "app/**"
      - ".github/workflows/android-arm64-release.yml"
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - ".github/workflows/android-arm64-release.yml"

concurrency:
  group: parallax-drive-arm64-release-only
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  arm64-release:
    name: Crash-hardened ARM64 release APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      NDK_VERSION: "28.0.12433566"
      APP_ID: "com.parallax.drive"
      MAIN_ACTIVITY: "com.parallax.drive.MainActivity"
      UPLOAD_SERVICE: "com.parallax.drive.UploadForegroundService"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK + ARM64 NDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;${NDK_VERSION}"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Setup Rust ARM64 target only
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Recreate Tauri Android project
        working-directory: app
        env:
          CI: "true"
        shell: bash
        run: |
          set -euo pipefail
          rm -rf src-tauri/gen/android
          npm run tauri android init -- --ci

      - name: Prepare crash-safe Android runtime glue
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          node scripts/prepare-android-runtime.cjs

      - name: Verify Parallax Drive Android runtime sources
        shell: bash
        run: |
          set -euo pipefail
          ROOT="app/src-tauri/gen/android"
          test -d "$ROOT"

          if grep -RIn --exclude-dir=build --exclude='*.lock' 'com\.cameronamer\.telegramdrive' \
            app/src-tauri/src "$ROOT"; then
            echo "::error::Old Telegram Drive package reference remains in Android build sources"
            exit 1
          fi

          MAIN="$(find "$ROOT/app/src" -type f -name 'MainActivity.kt' -print -quit)"
          SERVICE="$(find "$ROOT/app/src" -type f -name 'UploadForegroundService.kt' -print -quit)"
          MANIFEST="$ROOT/app/src/main/AndroidManifest.xml"
          PATHS="$ROOT/app/src/main/res/xml/parallax_file_paths.xml"

          test -n "$MAIN"
          test -n "$SERVICE"
          test -f "$MANIFEST"
          test -f "$PATHS"

          grep -F 'package com.parallax.drive' "$MAIN"
          grep -F 'fun openFileExternally' "$MAIN"
          grep -F 'fun getAndClearShareCount' "$MAIN"
          grep -F 'package com.parallax.drive' "$SERVICE"
          grep -F 'fun startService' "$SERVICE"
          grep -F 'fun stopService' "$SERVICE"
          grep -F 'com.parallax.drive.UploadForegroundService' "$MANIFEST"
          grep -F '${applicationId}.fileprovider' "$MANIFEST"
          grep -F 'android.permission.FOREGROUND_SERVICE' "$MANIFEST"

      - name: Enable release shrinking and strip native symbols
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/src-tauri/gen/android/app/build.gradle.kts")
          if not p.exists():
              raise SystemExit(f"missing generated Gradle file: {p}")

          s = p.read_text()
          s = re.sub(r'\s*jniLibs\.keepDebugSymbols\.add\("[^"]+"\)', '', s)

          if "isShrinkResources = true" not in s:
              s, count = re.subn(
                  r'(getByName\("release"\)\s*\{\s*\n\s*isMinifyEnabled\s*=\s*true)',
                  r'\1\n            isShrinkResources = true',
                  s,
                  count=1,
              )
              if count != 1:
                  raise SystemExit("could not patch release buildType")

          p.write_text(s)
          PY

      - name: Build obfuscated optimized ARM64 release APK
        working-directory: app
        env:
          CI: "true"
          PARALLAX_RELEASE_OBFUSCATE: "1"
        shell: bash
        run: |
          set -euo pipefail
          npm run tauri android build -- \
            --apk true \
            --ci \
            --target aarch64

      - name: Sign and 16K-align ARM64 release APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/src-tauri/gen/android/app/build/outputs/apk -type f -name '*release*.apk' -print | head -1)"
          if [ -z "$APK" ]; then
            APK="$(find app/src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' -print | head -1)"
          fi
          test -n "$APK"

          mkdir -p artifacts
          BUILD_TOOLS="${ANDROID_HOME}/build-tools/36.0.0"
          KEYSTORE="${RUNNER_TEMP}/parallax-arm64-release.jks"
          STORE_PASS="ParallaxRelease2026"

          keytool -genkeypair -noprompt \
            -keystore "$KEYSTORE" \
            -storepass "$STORE_PASS" \
            -keypass "$STORE_PASS" \
            -alias parallax \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10000 \
            -dname "CN=Parallax Drive, OU=Parallax, O=Parallax, L=Surat, ST=Gujarat, C=IN"

          "$BUILD_TOOLS/zipalign" -P 16 -f 4 \
            "$APK" artifacts/ParallaxDrive-arm64-release-aligned.apk

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias parallax \
            --ks-pass "pass:${STORE_PASS}" \
            --key-pass "pass:${STORE_PASS}" \
            --out artifacts/ParallaxDrive-arm64-release.apk \
            artifacts/ParallaxDrive-arm64-release-aligned.apk

          rm -f artifacts/ParallaxDrive-arm64-release-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs artifacts/ParallaxDrive-arm64-release.apk
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 artifacts/ParallaxDrive-arm64-release.apk

      - name: Validate crash-critical APK contents
        shell: bash
        run: |
          set -euo pipefail
          APK="artifacts/ParallaxDrive-arm64-release.apk"
          BUILD_TOOLS="${ANDROID_HOME}/build-tools/36.0.0"

          BADGING="$($BUILD_TOOLS/aapt dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -F "package: name='${APP_ID}'"
          printf '%s\n' "$BADGING" | grep -F "launchable-activity: name='${MAIN_ACTIVITY}'"
          printf '%s\n' "$BADGING" | grep -F "sdkVersion:'24'"

          ABI_LIST="$(unzip -Z1 "$APK" | awk -F/ '/^lib\/[^/]+\// {print $2}' | sort -u)"
          echo "ABIs in APK:"
          printf '%s\n' "$ABI_LIST"
          test "$ABI_LIST" = "arm64-v8a"

          DEX_DUMP="${RUNNER_TEMP}/parallax-dex-strings.txt"
          : > "$DEX_DUMP"
          while IFS= read -r dex; do
            unzip -p "$APK" "$dex" | strings >> "$DEX_DUMP"
          done < <(unzip -Z1 "$APK" | grep -E '^classes([0-9]+)?\.dex$')

          grep -F 'Lcom/parallax/drive/MainActivity;' "$DEX_DUMP"
          grep -F 'Lcom/parallax/drive/UploadForegroundService;' "$DEX_DUMP"
          grep -F 'openFileExternally' "$DEX_DUMP"
          grep -F 'getAndClearShareCount' "$DEX_DUMP"
          if grep -F 'Lcom/cameronamer/telegramdrive/' "$DEX_DUMP"; then
            echo "::error::Old package class remains in release DEX"
            exit 1
          fi

          NATIVE="${RUNNER_TEMP}/libapp_lib.so"
          unzip -p "$APK" 'lib/arm64-v8a/libapp_lib.so' > "$NATIVE"
          test -s "$NATIVE"

          NATIVE_STRINGS="${RUNNER_TEMP}/parallax-native-strings.txt"
          strings "$NATIVE" > "$NATIVE_STRINGS"
          grep -F 'com.parallax.drive.MainActivity' "$NATIVE_STRINGS"
          grep -F 'com.parallax.drive.UploadForegroundService' "$NATIVE_STRINGS"
          if grep -F 'com.cameronamer.telegramdrive' "$NATIVE_STRINGS"; then
            echo "::error::Old package string remains in native library"
            exit 1
          fi

          python3 - "$NATIVE" <<'PY'
          import subprocess
          import sys

          native = sys.argv[1]
          output = subprocess.check_output(["readelf", "-lW", native], text=True)
          aligns = []
          for line in output.splitlines():
              parts = line.split()
              if parts and parts[0] == "LOAD":
                  aligns.append(int(parts[-1], 16))
          if not aligns:
              raise SystemExit("No ELF LOAD segments found")
          if min(aligns) < 0x4000:
              raise SystemExit(f"Native ELF is not 16K-page compatible: LOAD aligns={aligns}")
          print(f"16K ELF LOAD alignment OK: {aligns}")
          PY

          echo "Final ARM64 APK:"
          ls -lh "$APK"

      - name: Upload ARM64 release APK
        uses: actions/upload-artifact@v4
        with:
          name: ParallaxDrive-ARM64-Stable-Release-APK
          path: artifacts/ParallaxDrive-arm64-release.apk
          if-no-files-found: error
          retention-days: 14
