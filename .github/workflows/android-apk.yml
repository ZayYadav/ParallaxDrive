name: Build Parallax Drive Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - parallax-drive-android-apk
    paths:
      - "app/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - ".github/workflows/android-apk.yml"

concurrency:
  group: parallax-drive-android-release
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Build + launch-test Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 150

    env:
      NDK_VERSION: "28.0.12433566"
      APP_ID: "com.parallax.drive"
      MAIN_ACTIVITY: "com.parallax.drive.MainActivity"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "emulator" \
            "ndk;${NDK_VERSION}"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Recreate Tauri Android project from current identifier
        working-directory: app
        env:
          CI: "true"
        shell: bash
        run: |
          set -euo pipefail
          # Never reuse generated Android sources after an application-id rename.
          rm -rf src-tauri/gen/android
          npm run tauri android init -- --ci

      - name: Verify generated Android namespace
        shell: bash
        run: |
          set -euo pipefail
          ROOT="app/src-tauri/gen/android"
          test -d "$ROOT"

          echo "Checking generated Android project for stale Telegram Drive package names..."
          if grep -RIn --exclude-dir=build --exclude='*.lock' 'com\.cameronamer\.telegramdrive' "$ROOT"; then
            echo "::error::Stale com.cameronamer.telegramdrive reference found in generated Android project"
            exit 1
          fi

          MAIN="$(find "$ROOT/app/src" -type f \( -name 'MainActivity.kt' -o -name 'MainActivity.java' \) -print -quit)"
          if [ -z "$MAIN" ]; then
            echo "::error::Generated MainActivity source not found"
            exit 1
          fi
          echo "MainActivity source: $MAIN"
          grep -F 'package com.parallax.drive' "$MAIN"

      - name: Enable R8/resource shrinking and native symbol stripping
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/src-tauri/gen/android/app/build.gradle.kts")
          if not p.exists():
              raise SystemExit(f"missing generated Gradle file: {p}")

          s = p.read_text()
          s = re.sub(r'\s*jniLibs\.keepDebugSymbols\.add\("[^"]+"\)', '', s)

          if "isShrinkResources = true" not in s:
              s, count = re.subn(
                  r'(getByName\("release"\)\s*\{\s*\n\s*isMinifyEnabled\s*=\s*true)',
                  r'\1\n            isShrinkResources = true',
                  s,
                  count=1,
              )
              if count != 1:
                  raise SystemExit("could not patch release buildType")

          p.write_text(s)
          PY

      - name: Build obfuscated optimized ARM64 release APK
        working-directory: app
        env:
          CI: "true"
          PARALLAX_RELEASE_OBFUSCATE: "1"
        run: |
          set -euo pipefail
          npm run tauri android build -- \
            --apk true \
            --ci \
            --target aarch64

      - name: Sign release APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/src-tauri/gen/android/app/build/outputs/apk -type f -name '*release*.apk' | head -1)"
          if [ -z "$APK" ]; then
            APK="$(find app/src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' | head -1)"
          fi
          test -n "$APK"

          mkdir -p artifacts
          BUILD_TOOLS="${ANDROID_HOME}/build-tools/36.0.0"
          KEYSTORE="${RUNNER_TEMP}/parallax-release.jks"
          STORE_PASS="ParallaxRelease2026"

          keytool -genkeypair -noprompt \
            -keystore "$KEYSTORE" \
            -storepass "$STORE_PASS" \
            -keypass "$STORE_PASS" \
            -alias parallax \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10000 \
            -dname "CN=Parallax Drive, OU=Parallax, O=Parallax, L=Surat, ST=Gujarat, C=IN"

          "$BUILD_TOOLS/zipalign" -p -f 4 "$APK" artifacts/ParallaxDrive-arm64-release-aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias parallax \
            --ks-pass "pass:${STORE_PASS}" \
            --key-pass "pass:${STORE_PASS}" \
            --out artifacts/ParallaxDrive-arm64-release.apk \
            artifacts/ParallaxDrive-arm64-release-aligned.apk

          rm -f artifacts/ParallaxDrive-arm64-release-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs artifacts/ParallaxDrive-arm64-release.apk

      - name: Validate release APK package and launcher class
        shell: bash
        run: |
          set -euo pipefail
          APK="artifacts/ParallaxDrive-arm64-release.apk"
          BUILD_TOOLS="${ANDROID_HOME}/build-tools/36.0.0"

          BADGING="$($BUILD_TOOLS/aapt dump badging "$APK")"
          printf '%s\n' "$BADGING"
          printf '%s\n' "$BADGING" | grep -F "package: name='${APP_ID}'"
          printf '%s\n' "$BADGING" | grep -F "launchable-activity: name='${MAIN_ACTIVITY}'"

          if printf '%s\n' "$BADGING" | grep -F 'com.cameronamer.telegramdrive'; then
            echo "::error::Release manifest still references old Telegram Drive package"
            exit 1
          fi

          FOUND_NEW=0
          while IFS= read -r dex; do
            if unzip -p "$APK" "$dex" | strings | grep -Fq 'Lcom/parallax/drive/MainActivity;'; then
              FOUND_NEW=1
            fi
            if unzip -p "$APK" "$dex" | strings | grep -Fq 'Lcom/cameronamer/telegramdrive/MainActivity;'; then
              echo "::error::Old MainActivity class found in release DEX"
              exit 1
            fi
          done < <(unzip -Z1 "$APK" | grep -E '^classes([0-9]+)?\.dex$')

          if [ "$FOUND_NEW" -ne 1 ]; then
            echo "::error::com.parallax.drive.MainActivity is missing from release DEX"
            exit 1
          fi

          echo "Release package/launcher validation passed."
          ls -lh "$APK"

      - name: Build x86_64 smoke-test APK
        working-directory: app
        env:
          CI: "true"
          PARALLAX_RELEASE_OBFUSCATE: "1"
        shell: bash
        run: |
          set -euo pipefail
          npm run tauri android build -- \
            --apk true \
            --debug \
            --ci \
            --target x86_64

          SMOKE_APK="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*debug*.apk' -print | head -1)"
          if [ -z "$SMOKE_APK" ]; then
            echo "::error::x86_64 smoke-test APK not found"
            exit 1
          fi
          echo "SMOKE_APK=$GITHUB_WORKSPACE/app/$SMOKE_APK" >> "$GITHUB_ENV"
          ls -lh "$SMOKE_APK"

      - name: Launch smoke test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -euo pipefail
            adb install -r "$SMOKE_APK"
            adb logcat -c
            adb shell am force-stop "$APP_ID" || true
            adb shell am start -W -n "$APP_ID/$MAIN_ACTIVITY"
            sleep 12

            PID="$(adb shell pidof "$APP_ID" | tr -d '\r' || true)"
            if [ -z "$PID" ]; then
              echo "::error::Parallax Drive process is not alive after launch"
              adb logcat -d -v threadtime
              exit 1
            fi

            adb logcat -d -v threadtime > "$RUNNER_TEMP/parallax-logcat.txt"
            cat "$RUNNER_TEMP/parallax-logcat.txt"

            if grep -E 'FATAL EXCEPTION: main|ClassNotFoundException:.*(MainActivity|com\.parallax\.drive)|Process: com\.parallax\.drive.*CRASH' "$RUNNER_TEMP/parallax-logcat.txt"; then
              echo "::error::Launch-time Android crash detected"
              exit 1
            fi

            echo "Parallax Drive launch smoke test passed with PID $PID"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ParallaxDrive-Release-APK
          path: artifacts/ParallaxDrive-arm64-release.apk
          if-no-files-found: error
          retention-days: 14
